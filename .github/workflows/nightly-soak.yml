name: nightly-soak

# Recurrence guard for the CI races fixed in issue #38. Soaks the previously
# flaky spots off the merge path (same tier idea as dogeos-core's tiered CI):
#   - the in-process timing-sensitive suite — the optimistic-sync
#     consolidation test, both build-coalescing tests, and the four payload-job
#     cancellation tests — plain and under deliberate CPU contention (the
#     original race only fired on contended runners), and
#   - the docker remote-source startup pair, repeated serially.
# Any failure here is a regression of a fixed race — treat it as a bug, not as
# noise to re-run. (A job hitting its own timeout is a capacity problem, not a
# race regression — the idle and contended soaks run as separate jobs so each
# gets its own budget.)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per in-process soak job (default 12)"
        required: false
        default: "12"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Queue rather than cancel: a concurrency-cancelled soak would post a
  # misleading mid-soak cancellation report and drown the signal of the run
  # that superseded it.
  cancel-in-progress: false

# The failure-report steps comment on an issue; everything else is read-only.
permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  soak-integration-idle:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 'nightly-2026-01-05'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Build test binaries
        run: |
          cargo nextest run --all-features --workspace --locked --no-run \
            -E 'test(test_should_consolidate_after_optimistic_sync) or test(coalesces_with) or test(cancels_inflight_payload_job) or test(remote_source_node_launches_when_remote_unreachable) or test(block_building_skipped_carries_head_number) or test(test_remote_block_source_resumes_from_correct_head)'
      - name: Soak timing-sensitive integration tests (idle)
        id: soak
        # Step-level timeout, below the job's 90: a JOB-level timeout cancels
        # the whole job and no later step (even with always()) runs, so a
        # hang would post nothing. A step-level timeout terminates only this
        # step and the reporter below still fires.
        timeout-minutes: 80
        env:
          # Passed through env, never interpolated into the script body: a
          # workflow_dispatch input is attacker-influencable text.
          ITERATIONS: ${{ inputs.iterations || '12' }}
        run: |
          set -euo pipefail
          [[ "$ITERATIONS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::iterations must be a positive integer"; exit 1; }
          for i in $(seq "$ITERATIONS"); do
            echo "::group::idle iteration $i/$ITERATIONS"
            # Superset of the loaded job's filter (this lane also soaks the
            # coalescing tests, whose in-flight-job precondition deliberate
            # contention can defeat), so a loaded-only failure is still
            # distinguishable from a plain regression. Single-threaded so the
            # tests' internal timing budgets are not compounded by peer load.
            cargo nextest run --all-features --workspace --locked --test-threads=1 \
              --no-tests=fail -E 'test(test_should_consolidate_after_optimistic_sync) or test(coalesces_with) or test(cancels_inflight_payload_job) or test(remote_source_node_launches_when_remote_unreachable) or test(block_building_skipped_carries_head_number) or test(test_remote_block_source_resumes_from_correct_head)'
            echo "::endgroup::"
          done
      - name: Report failure on the tracking issue
        # A soak failure is a race regression; a soak step killed by its
        # step-level timeout (the likeliest shape of a reintroduced
        # hang/livelock — reported as 'failure' or 'cancelled' depending on
        # runner version) must also leave a signal. always() is required
        # because the job is failing at this point. The job-level 90-minute
        # backstop is NOT reportable from inside the job (it cancels every
        # remaining step); it only exists for a hang in a non-soak step.
        # Setup/toolchain failures still must not be reported as regressions.
        if: always() && (steps.soak.outcome == 'failure' || steps.soak.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.soak.outcome }}" = "cancelled" ]; then
            body="nightly-soak job **${{ github.job }}** soak step was cancelled mid-soak (step timeout — possible hang/livelock regression or capacity problem — or a manual cancellation): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            body="nightly-soak job **${{ github.job }}** failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — a failure here is a regression of a race fixed in #45."
          fi
          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body "$body"

  soak-integration-loaded:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 'nightly-2026-01-05'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Build test binaries
        run: |
          cargo nextest run --all-features --workspace --locked --no-run \
            -E 'test(test_should_consolidate_after_optimistic_sync) or test(coalesces_with) or test(cancels_inflight_payload_job) or test(remote_source_node_launches_when_remote_unreachable) or test(block_building_skipped_carries_head_number) or test(test_remote_block_source_resumes_from_correct_head)'
      - name: Soak timing-sensitive integration tests (under CPU contention)
        id: soak
        # Step-level timeout: see the idle job's soak step.
        timeout-minutes: 80
        env:
          ITERATIONS: ${{ inputs.iterations || '12' }}
        run: |
          set -euo pipefail
          [[ "$ITERATIONS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::iterations must be a positive integer"; exit 1; }
          # Add real contention — the condition under which the original race
          # fired — but leave headroom: the tests run single-threaded below,
          # and full saturation would blow their internal budgets and
          # manufacture the false signal this lane exists to prevent.
          cleanup() { jobs -p | xargs -r kill 2>/dev/null || true; }
          trap cleanup EXIT
          # INT/TERM must actually stop the job (a bare cleanup trap would
          # resume the loop after handling the signal).
          trap 'cleanup; exit 130' INT TERM
          for c in $(seq 4); do yes > /dev/null & done
          for i in $(seq "$ITERATIONS"); do
            echo "::group::loaded iteration $i/$ITERATIONS"
            # Also soak the wall-clock-sensitive tests this fix introduced —
            # except the coalescing tests: their "a timer job is already in
            # flight" precondition is a capacity assumption that four CPU
            # spinners can legitimately defeat, and a false failure here would
            # be auto-reported as a race regression. The idle job soaks them.
            cargo nextest run --all-features --workspace --locked --test-threads=1 \
              --no-tests=fail -E 'test(test_should_consolidate_after_optimistic_sync) or test(cancels_inflight_payload_job) or test(remote_source_node_launches_when_remote_unreachable) or test(block_building_skipped_carries_head_number) or test(test_remote_block_source_resumes_from_correct_head)'
            echo "::endgroup::"
          done
      - name: Report failure on the tracking issue
        # A soak failure is a race regression; a soak step killed by its
        # step-level timeout (the likeliest shape of a reintroduced
        # hang/livelock — reported as 'failure' or 'cancelled' depending on
        # runner version) must also leave a signal. always() is required
        # because the job is failing at this point. The job-level 90-minute
        # backstop is NOT reportable from inside the job (it cancels every
        # remaining step); it only exists for a hang in a non-soak step.
        # Setup/toolchain failures still must not be reported as regressions.
        if: always() && (steps.soak.outcome == 'failure' || steps.soak.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.soak.outcome }}" = "cancelled" ]; then
            body="nightly-soak job **${{ github.job }}** soak step was cancelled mid-soak (step timeout — possible hang/livelock regression or capacity problem — or a manual cancellation): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            body="nightly-soak job **${{ github.job }}** failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — a failure here is a regression of a race fixed in #45."
          fi
          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body "$body"

  soak-docker-remote-source:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker test disk capacity
        run: |
          set -euo pipefail
          df -h /
          available_kib=$(df --output=avail / | tail -n 1 | tr -d ' ')
          minimum_kib=$((32 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "Docker Compose tests require at least 32 GiB free; available_kib=$available_kib" >&2
            exit 1
          fi
      - name: Soak docker remote-source tests
        id: soak
        # Step-level timeout: see the idle job's soak step.
        timeout-minutes: 80
        run: |
          set -euo pipefail
          # --no-tests=fail (nextest's default, pinned explicitly since the
          # install action is unpinned): if a rename ever empties the filter,
          # this guard must fail loudly instead of soaking nothing.
          for i in 1 2 3; do
            echo "::group::docker iteration $i/3"
            cargo nextest run --all-features --workspace --locked --no-tests=fail \
              -E 'test(docker_test_remote_block_source)' \
              --test-threads=1 --failure-output immediate --success-output never
            echo "::endgroup::"
          done
      - name: Report failure on the tracking issue
        # A soak failure is a race regression; a soak step killed by its
        # step-level timeout (the likeliest shape of a reintroduced
        # hang/livelock — reported as 'failure' or 'cancelled' depending on
        # runner version) must also leave a signal. always() is required
        # because the job is failing at this point. The job-level 90-minute
        # backstop is NOT reportable from inside the job (it cancels every
        # remaining step); it only exists for a hang in a non-soak step.
        # Setup/toolchain failures still must not be reported as regressions.
        if: always() && (steps.soak.outcome == 'failure' || steps.soak.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.soak.outcome }}" = "cancelled" ]; then
            body="nightly-soak job **${{ github.job }}** soak step was cancelled mid-soak (step timeout — possible hang/livelock regression or capacity problem — or a manual cancellation): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            body="nightly-soak job **${{ github.job }}** failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — a failure here is a regression of a race fixed in #45."
          fi
          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body "$body"
