name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/release-*.sh"
      - ".github/scripts/publish-image-index.sh"
      - ".cargo/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".dockerignore"
      - "Dockerfile"
      - "crates/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: true
        default: "latest"
        type: string
      build_arm64:
        description: "Build arm64 image"
        required: true
        type: boolean
        default: false

env:
  IMAGE_NAME: dogeos69/rollup-node

jobs:
  prepare:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      matrix_count: ${{ steps.metadata.outputs.matrix_count }}
      tags: ${{ steps.metadata.outputs.tags }}
      expected_platforms: ${{ steps.metadata.outputs.expected_platforms }}
      environment: ${{ steps.metadata.outputs.environment }}
      workspace_version: ${{ steps.metadata.outputs.workspace_version }}
      version_major: ${{ steps.metadata.outputs.version_major }}
      version_minor: ${{ steps.metadata.outputs.version_minor }}
      version_patch: ${{ steps.metadata.outputs.version_patch }}
      vcs_ref: ${{ steps.metadata.outputs.vcs_ref }}
      ref_name: ${{ steps.metadata.outputs.ref_name }}
      build_date: ${{ steps.metadata.outputs.build_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test release metadata
        run: .github/scripts/test-release-metadata.sh

      - name: Prepare build metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          MANUAL_TAG: ${{ inputs.tag }}
          BUILD_ARM64: ${{ inputs.build_arm64 }}
        run: |
          set -euo pipefail

          mapfile -t workspace_versions < <(
            awk '
              $0 == "[workspace.package]" { in_workspace_package = 1; next }
              in_workspace_package && /^\[/ { exit }
              in_workspace_package && /^version = "[^"]+"$/ {
                value = $0
                sub(/^version = "/, "", value)
                sub(/"$/, "", value)
                print value
              }
            ' Cargo.toml
          )
          if [[ ${#workspace_versions[@]} -ne 1 ]]; then
            echo "expected exactly one workspace package version" >&2
            exit 1
          fi
          workspace_version=${workspace_versions[0]}
          metadata=$(
            EVENT_NAME="$EVENT_NAME" \
            REF_TYPE="$REF_TYPE" \
            REF_NAME="$REF_NAME" \
            GITHUB_REF="$GITHUB_REF_VALUE" \
            GITHUB_SHA="$GITHUB_SHA_VALUE" \
            WORKSPACE_VERSION="$workspace_version" \
            IMAGE_NAME="$IMAGE_NAME" \
            MANUAL_TAG="$MANUAL_TAG" \
            BUILD_ARM64="${BUILD_ARM64:-false}" \
              .github/scripts/release-metadata.sh
          )

          jq -e . <<<"$metadata" >/dev/null
          {
            echo "matrix=$(jq -c .matrix <<<"$metadata")"
            echo "matrix_count=$(jq -r .matrix_count <<<"$metadata")"
            echo "tags=$(jq -c .tags <<<"$metadata")"
            echo "expected_platforms=$(jq -c .expected_platforms <<<"$metadata")"
            echo "environment=$(jq -r .environment <<<"$metadata")"
            echo "workspace_version=$(jq -r .workspace_version <<<"$metadata")"
            echo "version_major=$(jq -r .version_major <<<"$metadata")"
            echo "version_minor=$(jq -r .version_minor <<<"$metadata")"
            echo "version_patch=$(jq -r .version_patch <<<"$metadata")"
            echo "vcs_ref=$(jq -r .vcs_ref <<<"$metadata")"
            echo "ref_name=$(jq -r .ref_name <<<"$metadata")"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          cache-binary: false

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: ${{ matrix.platform }}
          secrets: |
            github_token=${{ secrets.DOGEOS_RETH_TOKEN || secrets.DOGEOS_RETH2_TOKEN || github.token }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          provenance: mode=max,version=v1
          sbom: false
          labels: |
            org.opencontainers.image.title=rollup-node
            org.opencontainers.image.description=DogeOS rollup-node service
            org.opencontainers.image.version=${{ needs.prepare.outputs.workspace_version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dogeos.environment=${{ needs.prepare.outputs.environment }}
            dogeos.version.major=${{ needs.prepare.outputs.version_major }}
            dogeos.version.minor=${{ needs.prepare.outputs.version_minor }}
            dogeos.version.patch=${{ needs.prepare.outputs.version_patch }}
            dogeos.git.sha=${{ needs.prepare.outputs.vcs_ref }}
            dogeos.git.branch=${{ needs.prepare.outputs.ref_name }}

      - name: Build and push Docker image by digest
        if: ${{ github.event_name != 'pull_request' }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          secrets: |
            github_token=${{ secrets.DOGEOS_RETH_TOKEN || secrets.DOGEOS_RETH2_TOKEN || github.token }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
          provenance: mode=max,version=v1
          sbom: false
          labels: |
            org.opencontainers.image.title=rollup-node
            org.opencontainers.image.description=DogeOS rollup-node service
            org.opencontainers.image.version=${{ needs.prepare.outputs.workspace_version }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            dogeos.environment=${{ needs.prepare.outputs.environment }}
            dogeos.version.major=${{ needs.prepare.outputs.version_major }}
            dogeos.version.minor=${{ needs.prepare.outputs.version_minor }}
            dogeos.version.patch=${{ needs.prepare.outputs.version_patch }}
            dogeos.git.sha=${{ needs.prepare.outputs.vcs_ref }}
            dogeos.git.branch=${{ needs.prepare.outputs.ref_name }}

      - name: Validate digest
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:([0-9a-f]{64})$ ]]; then
            echo "invalid build digest: $BUILD_DIGEST" >&2
            exit 1
          fi

          docker buildx imagetools inspect "${IMAGE_NAME}@${BUILD_DIGEST}" >/dev/null
          mkdir -p /tmp/digests
          touch "/tmp/digests/${BUILD_ARCH}-${BASH_REMATCH[1]}"

      - name: Upload digest
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - prepare
      - build
    if: ${{ github.event_name != 'pull_request' && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
    concurrency:
      group: docker-publish-rollup-node
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          cache-binary: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and verify image index
        env:
          DIGEST_DIR: /tmp/digests
          EXPECTED_PLATFORMS_JSON: ${{ needs.prepare.outputs.expected_platforms }}
          DOCKER_TAGS_JSON: ${{ needs.prepare.outputs.tags }}
          EXPECTED_DIGEST_COUNT: ${{ needs.prepare.outputs.matrix_count }}
        run: .github/scripts/publish-image-index.sh
