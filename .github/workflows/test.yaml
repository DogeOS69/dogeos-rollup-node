name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 'nightly-2026-01-05'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Run unit tests
        run: cargo nextest run --all-features --workspace --locked -E '!kind(test)'

  integration:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Above the sum of the step budgets (45-minute build + 50-minute run)
    # plus setup, or the job-level cap cancels the active step and discards
    # the output the step caps exist to preserve.
    timeout-minutes: 110
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 'nightly-2026-01-05'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Install pinned Anvil
        run: |
          set -euo pipefail
          ANVIL_BIN="$(.github/assets/install_anvil.sh "$RUNNER_TEMP/anvil" | tail -n1)"
          [ -x "$ANVIL_BIN" ] || { echo "::error::Anvil install produced no executable at '$ANVIL_BIN'"; exit 1; }
          echo "ANVIL_BIN=$ANVIL_BIN" >> "$GITHUB_ENV"
      - name: Build test binaries
        # Separate step so the run cap below bounds TESTS, not a cold
        # compile (25-40 min), and a hung build fails here with its own
        # output preserved.
        timeout-minutes: 45
        run: |
          cargo nextest run --all-features --workspace --locked --no-run \
            -E 'kind(test) and not test(docker)'
      - name: Run integration tests
        # Step-level: with --no-fail-fast a broadly-broken build burns the
        # full budget, and only a step timeout preserves the step's output
        # (a job-level cancel discards it).
        timeout-minutes: 50
        run: |
          # --no-tests=fail (nextest's default, pinned explicitly since the
          # install action is unpinned): a rename emptying the filter must
          # fail loudly, not exit green having run nothing.
          cargo nextest run --all-features --workspace --locked --no-fail-fast \
            --no-tests=fail -E 'kind(test) and not test(docker)' \
            -- --skip test_should_consolidate_to_block_15k

  integration-docker-compose:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # Above the sum of the step budgets (45-minute build + 75-minute run)
    # plus setup: see the integration job.
    timeout-minutes: 135
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker test disk capacity
        run: |
          set -euo pipefail
          df -h /
          available_kib=$(df --output=avail / | tail -n 1 | tr -d ' ')
          minimum_kib=$((32 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "Docker Compose tests require at least 32 GiB free; available_kib=$available_kib" >&2
            exit 1
          fi
      - name: Build test binaries
        # Separate step: see the integration lane's rationale.
        timeout-minutes: 45
        run: |
          cargo nextest run --all-features --workspace --locked --no-run \
            -E 'test(docker)'
      - name: Run Docker Compose integration tests
        # Step-level: see the integration lane's rationale.
        timeout-minutes: 75
        run: |
          # --no-tests=fail (nextest's default, pinned explicitly since the
          # install action is unpinned): a rename emptying the filter must
          # fail loudly, not exit green having run nothing.
          cargo nextest run --all-features --workspace --locked --no-fail-fast \
            --no-tests=fail -E 'test(docker)' --test-threads=1 \
            --failure-output immediate \
            --success-output never \
            --verbose
        env:
          RUST_LOG: trace
          RUST_BACKTRACE: full
