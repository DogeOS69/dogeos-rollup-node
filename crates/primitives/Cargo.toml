[package]
name = "rollup-node-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
exclude.workspace = true

[lints]
workspace = true

[dependencies]
# alloy
alloy-chains.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace = true

# scroll
dogeos-protocol-types.workspace = true
dogeos-reth-engine.workspace = true
dogeos-chainspec.workspace = true

# reth
reth-network-peers.workspace = true
reth-primitives-traits.workspace = true
dogeos-reth-primitives.workspace = true
reth-chainspec.workspace = true
reth-node-core.workspace = true

# misc
arbitrary = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["from"] }
eyre.workspace = true
serde.workspace = true

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "alloy-rpc-types-engine/std",
    "dogeos-protocol-types/std",
    "derive_more/std",
    "dogeos-reth-engine/std",
    "alloy-eips/std",
    "dogeos-reth-primitives/std",
    "reth-primitives-traits/std",
    "alloy-consensus/std",
    "alloy-chains/std",
    "reth-chainspec/std",
    "dogeos-chainspec/std",
    "reth-network-peers/std",
    "alloy-rpc-types-eth/std",
]
arbitrary = [
    "std",
    "dep:arbitrary",
    "alloy-primitives/arbitrary",
    "dogeos-protocol-types/arbitrary",
    "alloy-eips/arbitrary",
    "dogeos-reth-primitives/std",
    "dogeos-reth-primitives/arbitrary",
    "reth-primitives-traits/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-rpc-types-engine/arbitrary",
    "alloy-chains/arbitrary",
    "reth-chainspec/arbitrary",
    "alloy-rpc-types-eth/arbitrary",
]
serde = [
    "alloy-chains/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "alloy-rpc-types-engine/serde",
    "reth-primitives-traits/serde",
    "dogeos-reth-primitives/serde",
    "dogeos-protocol-types/serde",
    "alloy-rpc-types-eth/serde",
]
