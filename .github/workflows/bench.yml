# Runs benchmarks.

on:
  pull_request:
  push:
    branches: [main]
  # Allows CodSpeed to trigger a backtest of the benchmarks on demand.
  workflow_dispatch:

permissions:
  contents: read
  # Required for the OpenID Connect authentication with CodSpeed.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  BASELINE: base
  SEED: rollup-node

name: bench
jobs:
  codspeed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-codspeed
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build the benchmark target(s)
        run: |
          cargo codspeed build --measurement-mode simulation \
            --package scroll-codec \
            --package rollup-node-primitives \
            --package scroll-derivation-pipeline
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run
