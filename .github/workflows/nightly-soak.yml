name: nightly-soak

# Recurrence guard for the CI races fixed in issue #38. Soaks the previously
# flaky spots off the merge path (same tier idea as dogeos-core's tiered CI):
#   - test_should_consolidate_after_optimistic_sync, plain and under deliberate
#     CPU contention (the original race only fired on contended runners), and
#   - the docker remote-source startup pair, repeated serially.
# Any failure here is a regression of a fixed race — treat it as a bug, not as
# noise to re-run. (A job hitting its own timeout is a capacity problem, not a
# race regression — the idle and contended soaks run as separate jobs so each
# gets its own budget.)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Iterations per in-process soak job (default 25)"
        required: false
        default: "25"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  soak-integration-idle:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 'nightly-2026-01-05'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Build test binaries
        run: |
          cargo nextest run --all-features --workspace --locked --no-run \
            -E 'test(test_should_consolidate_after_optimistic_sync)'
      - name: Soak optimistic-sync consolidation test (idle)
        env:
          # Passed through env, never interpolated into the script body: a
          # workflow_dispatch input is attacker-influencable text.
          ITERATIONS: ${{ inputs.iterations || '25' }}
        run: |
          set -euo pipefail
          [[ "$ITERATIONS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::iterations must be a positive integer"; exit 1; }
          for i in $(seq "$ITERATIONS"); do
            echo "::group::idle iteration $i/$ITERATIONS"
            cargo nextest run --all-features --workspace --locked \
              -E 'test(test_should_consolidate_after_optimistic_sync)'
            echo "::endgroup::"
          done
      - name: Report failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body \
            "nightly-soak job **${{ github.job }}** failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — a failure here is a regression of a race fixed in #45."

  soak-integration-loaded:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 'nightly-2026-01-05'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Build test binaries
        run: |
          cargo nextest run --all-features --workspace --locked --no-run \
            -E 'test(test_should_consolidate_after_optimistic_sync)'
      - name: Soak optimistic-sync consolidation test (under CPU contention)
        env:
          ITERATIONS: ${{ inputs.iterations || '25' }}
        run: |
          set -euo pipefail
          [[ "$ITERATIONS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::iterations must be a positive integer"; exit 1; }
          # Saturate most cores to mimic a contended runner — the condition
          # under which the original race fired.
          for c in $(seq 6); do yes > /dev/null & done
          trap 'jobs -p | xargs -r kill 2>/dev/null || true' EXIT
          for i in $(seq "$ITERATIONS"); do
            echo "::group::loaded iteration $i/$ITERATIONS"
            # Also soak the wall-clock-sensitive tests this fix introduced:
            # the two coalescing tests and the import-cancellation test.
            cargo nextest run --all-features --workspace --locked \
              -E 'test(test_should_consolidate_after_optimistic_sync) or test(coalesces_with) or test(test_chain_import_cancels_inflight_payload_job)'
            echo "::endgroup::"
          done
      - name: Report failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body \
            "nightly-soak job **${{ github.job }}** failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — a failure here is a regression of a race fixed in #45."

  soak-docker-remote-source:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v6
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker test disk capacity
        run: |
          set -euo pipefail
          df -h /
          available_kib=$(df --output=avail / | tail -n 1 | tr -d ' ')
          minimum_kib=$((32 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "Docker Compose tests require at least 32 GiB free; available_kib=$available_kib" >&2
            exit 1
          fi
      - name: Soak docker remote-source tests
        run: |
          set -euo pipefail
          # Deliberately NO --no-tests=pass: if a rename ever empties the
          # filter, this guard must fail loudly instead of soaking nothing.
          for i in 1 2 3; do
            echo "::group::docker iteration $i/3"
            cargo nextest run --all-features --workspace --locked \
              -E 'test(docker_test_remote_block_source)' \
              --test-threads=1 --failure-output immediate --success-output never
            echo "::endgroup::"
          done
      - name: Report failure on the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 38 --repo "$GITHUB_REPOSITORY" --body \
            "nightly-soak job **${{ github.job }}** failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — a failure here is a regression of a race fixed in #45."
