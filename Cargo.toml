dogeos-reth-node = { git = "https://github.com/DogeOS69/dogeos-reth2.git", rev = "ec85b4abd8be05705522fe8e30caf3d22a0803cd", default-features = false }
dogeos-reth-primitives = { git = "https://github.com/DogeOS69/dogeos-reth2.git", rev = "ec85b4abd8be05705522fe8e30caf3d22a0803cd", default-features = false }
